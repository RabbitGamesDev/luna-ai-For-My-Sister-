<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" id="svg-luna">
  <defs>
    <!-- Gradientes para pelo suave y ojos cristalinos -->
    <radialGradient id="grad-body" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="70%" stop-color="#F2E3D0"/>
      <stop offset="100%" stop-color="#E2CCA6"/>
    </radialGradient>
    <radialGradient id="grad-mask" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#4A3425"/>
      <stop offset="85%" stop-color="#2D1E15"/>
      <stop offset="100%" stop-color="#1A100B"/>
    </radialGradient>
    <radialGradient id="grad-eye" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#80E5FF"/>
      <stop offset="40%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#004499"/>
    </radialGradient>
    <linearGradient id="grad-ear" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D1E15"/>
      <stop offset="100%" stop-color="#6B4D3B"/>
    </linearGradient>
  </defs>

  <!-- Sombra inferior -->
  <ellipse cx="100" cy="188" rx="65" ry="8" fill="#E2CCA6" opacity="0.5"/>

  <!-- Oreja Izquierda -->
  <g class="ear ear-left">
    <path d="M 35,80 Q 15,15 65,38 Z" fill="url(#grad-ear)" />
    <path d="M 38,72 Q 25,25 58,42 Z" fill="#E295A3" opacity="0.7"/>
  </g>

  <!-- Oreja Derecha -->
  <g class="ear ear-right">
    <path d="M 165,80 Q 185,15 135,38 Z" fill="url(#grad-ear)" />
    <path d="M 162,72 Q 175,25 142,42 Z" fill="#E295A3" opacity="0.7"/>
  </g>

  <!-- Cabeza Principal -->
  <path d="M 35,110 C 30,60 170,60 165,110 C 165,160 35,160 35,110 Z" fill="url(#grad-body)"/>

  <!-- Máscara Facial Siamés -->
  <path d="M 55,115 C 50,82 150,82 145,115 C 145,145 55,145 55,115 Z" fill="url(#grad-mask)"/>

  <!-- Mejillas Rubor (Sonrojo) -->
  <ellipse id="blush-left" cx="52" cy="122" rx="10" ry="6" fill="#FF80AB" opacity="0.35"/>
  <ellipse id="blush-right" cx="148" cy="122" rx="10" ry="6" fill="#FF80AB" opacity="0.35"/>

  <!-- OJO IZQUIERDO -->
  <g id="eye-left-group">
    <ellipse cx="72" cy="108" rx="14" ry="18" fill="url(#grad-eye)"/>
    <!-- Pupila -->
    <ellipse id="pupil-left" cx="72" cy="108" rx="7" ry="13" fill="#0D1B2A"/>
    <!-- Destellos de luz -->
    <circle cx="68" cy="99" r="4.5" fill="#FFFFFF"/>
    <circle cx="76" cy="114" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- OJO DERECHO -->
  <g id="eye-right-group">
    <ellipse cx="128" cy="108" rx="14" ry="18" fill="url(#grad-eye)"/>
    <!-- Pupila -->
    <ellipse id="pupil-right" cx="128" cy="108" rx="7" ry="13" fill="#0D1B2A"/>
    <!-- Destellos de luz -->
    <circle cx="124" cy="99" r="4.5" fill="#FFFFFF"/>
    <circle cx="132" cy="114" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- Nariz de Gatita Siamés -->
  <path d="M 95,124 Q 100,121 105,124 Q 100,131 95,124 Z" fill="#FFB7B2"/>

  <!-- Boca (Dinámica para cambiar expresión) -->
  <path id="luna-mouth" d="M 90,132 Q 95,137 100,133 Q 105,137 110,132" stroke="#FFFDF9" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Bigotes Blancos Brillantes -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="45" y1="122" x2="12" y2="116"/>
    <line x1="42" y1="128" x2="15" y2="128"/>
    <line x1="45" y1="134" x2="18" y2="140"/>
    
    <line x1="155" y1="122" x2="188" y2="116"/>
    <line x1="158" y1="128" x2="185" y2="128"/>
    <line x1="155" y1="134" x2="182" y2="140"/>
  </g>

  <!-- Cascabel / Collar de Luna -->
  <path d="M 70,162 Q 100,172 130,162" stroke="#FFD700" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="169" r="7" fill="#FFD700"/>
  <circle cx="100" cy="169" r="2" fill="#B8860B"/>
</svg>
