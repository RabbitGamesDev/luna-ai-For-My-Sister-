<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luna AI - Para Maia</title>
  
  <!-- FUENTES K-STYLE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <div id="app-root">
    
    <!-- ENCABEZADO LUNA -->
    <header id="app-header">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" class="luna-avatar-img" alt="Luna">
      <div>
        <h2 style="font-size: 16px; font-weight: 700; color: #4A4A4A; margin: 0;">Luna</h2>
        <span style="font-size: 11px; color: #888;">Gatita Siamesa AI 🌸</span>
      </div>
    </header>

    <!-- BANNER DE ADVERTENCIA API -->
    <div id="api-warning-banner" style="display:none; background: #FFF3CD; color: #856404; padding: 10px; font-size: 12px; text-align: center; font-weight: 600;">
      ⚠️ Configura la clave en el panel de Padres (⚙️) para que Luna pueda responder.
    </div>

    <!-- CONTENEDOR PRINCIPAL DE VISTAS -->
    <main style="flex: 1; position: relative; overflow: hidden;">
      
      <!-- VISTA 1: HOME / CHAT -->
      <section id="view-home" class="view-container active">
        <div id="chat-messages">
          <div class="chat-bubble luna-bubble">
            <span class="luna-name">Luna 🐾</span>
            ¡Miau! Hola Maia 🌸 Soy tu gatita Luna. ¿Quieres platicar, escribir en tu diario o cantar en el karaoke? 🐾
          </div>
        </div>

        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Escribe un mensaje a Luna..." autocomplete="off">
          <button type="submit">💖</button>
        </form>
      </section>

      <!-- VISTA 2: DIARIO -->
      <section id="view-journal" class="view-container"></section>

      <!-- VISTA 3: KARAOKE -->
      <section id="view-karaoke" class="view-container"></section>

      <!-- VISTA 4: CÁMARA -->
      <section id="view-camera" class="view-container"></section>

      <!-- VISTA 5: PADRES / ADMIN -->
      <section id="view-admin" class="view-container"></section>

    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (ESTILO APP NATIVA) -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="home">
        <span class="icon">💬</span>
        <span>Chat</span>
      </button>
      <button class="nav-btn" data-view="journal">
        <span class="icon">📖</span>
        <span>Diario</span>
      </button>
      <button class="nav-btn" data-view="karaoke">
        <span class="icon">🎤</span>
        <span>Karaoke</span>
      </button>
      <button class="nav-btn" data-view="camera">
        <span class="icon">📸</span>
        <span>Cámara</span>
      </button>
      <button class="nav-btn" data-view="admin">
        <span class="icon">⚙️</span>
        <span>Padres</span>
      </button>
    </nav>

  </div>

  <!-- SCRIPTS EN ORDEN CORRECTO -->
  <script src="js/ai.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/karaoke.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
